<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div class="parent-container">
      <div class="image-container">
        <img class="img-perfume" src="./images/image-product-desktop.jpg"  alt="Perfume Image" >
        <img class="img-perfume-mobile" src="./images/image-product-mobile.jpg"  alt="Perfume Image MObile"> 
      </div>
   
      <div class="main">
        <div class="product-perfume">
            Perfume
        </div>
        <div class="h1">
          <h1>Gabrielle Essence Eau De Parfum</h1>
        </div>
        <div class="product-description">
          <p>
            A floral, solar and voluptuous interpretation composed by Olivier Polge, 
            Perfumer-Creator for the House of CHANEL.
          </p>
        </div>
        <div class="product-price">
          $149.99
        </div>
        <div class="product-actions">
          <img class='cart' src="./images/icon-cart.svg" alt="Add to Cart"> Add to Cart
        </div>
      </div>
    </div>  
</body>
</html>
